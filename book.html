<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book Reading Tracker</title>
<style>
    body{
        font-family: Arial, sans-serif;
        margin:0;
        padding:0;
        background: url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=1600&q=80') no-repeat center center fixed;
        background-size: cover;
        color:#fff;
    }

    .overlay{
        background: rgba(0,0,0,0.78);
        min-height: 100vh;
        padding: 20px;
    }

    .container{
        width:70%;
        margin:auto;
    }

    h1{
        text-align:center;
        margin-bottom:10px;
        letter-spacing:1px;
    }

    /* FORM UI IMPROVED */
    .form-box{
        background: rgba(255,255,255,0.08);
        padding:18px;
        border-radius:16px;
        margin-bottom:20px;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .form{
        display:grid;
        grid-template-columns: 1fr 1fr;
        gap:12px;
    }

    input{
        padding:14px;
        border:none;
        border-radius:12px;
        outline:none;
        background: rgba(255,255,255,0.75);
        font-size:14px;
        transition:0.2s;
    }

    input:focus{
        background: rgba(255,255,255,0.95);
        transform: scale(1.02);
    }

    button{
        cursor:pointer;
        font-weight:bold;
        border:none;
    }

    .create-btn{
        grid-column: span 2;
        background: linear-gradient(135deg,#00c853,#00b0ff);
        color:white;
        padding:12px;
        border-radius:10px;
        font-size:15px;
    }

    .header-bar{
        display:flex;
        justify-content:flex-end;
        margin-bottom:10px;
    }

    .clear-btn{
        background:red;
        color:white;
        padding:8px 12px;
        border-radius:8px;
    }

    .book-title{
        text-align:center;
        margin:15px 0;
    }

    .book-title h2{
        font-size:30px;
        margin:0;
    }

    .book-title small{
        font-style:italic;
        opacity:0.8;
    }

    table{
        width:100%;
        border-collapse: collapse;
        background: rgba(255,255,255,0.10);
        margin-top:10px;
        border-radius:10px;
        overflow:hidden;
    }

    th, td{
        padding:10px;
        text-align:center;
        border-bottom:1px solid rgba(255,255,255,0.2);
        font-size:14px;
    }

    tr.missed{ background: rgba(255,0,0,0.25); }
    tr.done{ background: rgba(0,255,0,0.2); }

    .icon-btn{
        cursor:pointer;
        font-size:18px;
        margin:0 5px;
    }

</style>
</head>
<body>
<div class="overlay">
<div class="container">

<h1>📚 Book Reading Tracker</h1>

<div class="form-box" id="formBox">
    <div class="form">
        <input type="text" id="bookName" placeholder="Book Name" />
        <input type="text" id="authorName" placeholder="Author Name" />
        <input type="number" id="totalPages" placeholder="Total Pages" />
        <input type="date" id="startDate" />
        <input type="number" id="duration" placeholder="Duration (Days)" />
        <button class="create-btn" onclick="generatePlan()">Create Reading Plan</button>
    </div>
</div>

<div class="header-bar">
    <button class="clear-btn" onclick="resetData()">Clear Data</button>
</div>

<div class="book-title" id="bookInfo"></div>

<table id="table" style="display:none;">
    <thead>
        <tr>
            <th>Day</th>
            <th>Date</th>
            <th>Pages</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

</div>
</div>

<script>
let plan = [];

const daysName = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function formatDate(d){
    let day = String(d.getDate()).padStart(2,'0');
    let month = String(d.getMonth()+1).padStart(2,'0');
    let year = d.getFullYear();
    return `${day}-${month}-${year}`;
}

// FIX: ensure function is always defined before click usage
function generatePlan(){
    let book = document.getElementById("bookName").value;
    let author = document.getElementById("authorName").value;
    let totalPages = parseInt(document.getElementById("totalPages").value);
    let startDate = new Date(document.getElementById("startDate").value);
    let days = parseInt(document.getElementById("duration").value);

    if(!book || !totalPages || !startDate || !days){
        alert("Please fill all fields");
        return;
    }

    let pagesPerDay = Math.ceil(totalPages / days);

    plan = [];

    for(let i=0;i<days;i++){
        let startPage = (i*pagesPerDay)+1;
        let endPage = Math.min((i+1)*pagesPerDay, totalPages);

        plan.push({
            done:false,
            pages: startPage + " - " + endPage
        });
    }

    localStorage.setItem("bookPlan", JSON.stringify(plan));
    localStorage.setItem("bookMeta", JSON.stringify({book,author}));
    localStorage.setItem("startDate", document.getElementById("startDate").value);

    document.getElementById("formBox").style.display = "none";

    renderTable();
}

function renderTable(){
    let stored = localStorage.getItem("bookPlan");
    let meta = JSON.parse(localStorage.getItem("bookMeta"));
    let startDate = new Date(localStorage.getItem("startDate"));

    if(!stored) return;

    plan = JSON.parse(stored);

    document.getElementById("table").style.display = "table";

    document.getElementById("bookInfo").innerHTML = 
        `<h2>📖 ${meta.book}</h2><small>✍ ${meta.author}</small>`;

    let tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    plan.forEach((p,i)=>{
        let date = new Date(startDate);
        date.setDate(date.getDate()+i);

        let today = new Date();
        let dStr = formatDate(date);

        let status = "";
        if(p.done) status="done";
        else if(date < today) status="missed";

        let row = document.createElement("tr");
        row.className = status;

        row.innerHTML = `
            <td>Day ${i+1} (${daysName[date.getDay()]})</td>
            <td>${dStr}</td>
            <td>${p.pages}</td>
            <td><input type='checkbox' ${p.done?'checked':''} onchange='toggle(${i})'></td>
            <td>
                <span class='icon-btn' onclick='duplicateRow(${i})'>📋</span>
                <span class='icon-btn' onclick='deleteRow(${i})'>🗑️</span>
            </td>
        `;

        tbody.appendChild(row);
    });
}

function toggle(i){
    plan[i].done = !plan[i].done;
    localStorage.setItem("bookPlan", JSON.stringify(plan));
    renderTable();
}

function duplicateRow(i){
    let copy = {...plan[i], done:false};
    plan.splice(i+1,0,copy);
    localStorage.setItem("bookPlan", JSON.stringify(plan));
    renderTable();
}

function deleteRow(i){
    plan.splice(i,1);
    localStorage.setItem("bookPlan", JSON.stringify(plan));
    renderTable();
}

function resetData(){
    localStorage.clear();
    location.reload();
}

window.onload = renderTable;
</script>
</body>
</html>
